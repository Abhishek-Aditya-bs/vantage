<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded-square background (maskable-safe: icon art sits within inner 80% = 102–410) -->
  <rect width="512" height="512" rx="96" ry="96" fill="#1a1410"/>

  <!-- Pixel-art camera body: 288×192 grid of 16px pixels, centred at 256,280 -->
  <!-- Camera body rectangle: x=112 y=200 w=288 h=192 -->
  <rect x="112" y="200" width="288" height="192" rx="16" ry="16" fill="#c8b89a"/>

  <!-- Camera top bump (viewfinder/hotshoe hump): x=176 y=152 w=160 h=56 -->
  <rect x="176" y="152" width="160" height="56" rx="8" ry="8" fill="#c8b89a"/>

  <!-- Lens ring (outer): circle cx=256 cy=296 r=72 -->
  <circle cx="256" cy="296" r="72" fill="#3d2e1e"/>
  <!-- Lens ring (middle): circle cx=256 cy=296 r=58 -->
  <circle cx="256" cy="296" r="58" fill="#1a1410"/>
  <!-- Lens inner glass: circle cx=256 cy=296 r=44 -->
  <circle cx="256" cy="296" r="44" fill="#2a3d5c"/>
  <!-- Lens highlight dot -->
  <circle cx="238" cy="278" r="10" fill="#6aa8e8" opacity="0.6"/>
  <circle cx="238" cy="278" r="5" fill="#b8d8f8" opacity="0.8"/>

  <!-- Shutter button: rect x=336 y=184 w=32 h=24 rx=4 -->
  <rect x="336" y="184" width="32" height="24" rx="4" ry="4" fill="#8a6a4a"/>

  <!-- Flash / indicator pixel row on body top-left -->
  <rect x="128" y="216" width="16" height="16" rx="2" ry="2" fill="#e8c060"/>
  <rect x="152" y="216" width="8" height="8" rx="1" ry="1" fill="#8a6a4a"/>

  <!-- Pixel-art grip lines on left edge of body -->
  <rect x="112" y="232" width="8" height="8" fill="#a89070"/>
  <rect x="112" y="248" width="8" height="8" fill="#a89070"/>
  <rect x="112" y="264" width="8" height="8" fill="#a89070"/>
  <rect x="112" y="280" width="8" height="8" fill="#a89070"/>
</svg>
