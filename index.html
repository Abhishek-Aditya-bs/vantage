<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta
      name="description"
      content="Vantage — scan a QR to join a space, stream every photo onto a shared live wall, and trigger a synchronized Moment where every phone captures the same instant into one multi-angle artifact."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vantage — every angle, one moment" />

      property="og:description"
      content="Real-time multi-camera event capture. Join by QR, shoot to a shared live wall, fire a synchronized Moment."
    />

    <title>Vantage — every angle, one moment</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vantage" />

    <!-- Cloudflare Turnstile (loads async; the app falls back gracefully if absent) -->

      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
